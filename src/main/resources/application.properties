spring.application.name=ai-interviewer
server.port=8080

# API Key 唯一来源：环境变量 DASHSCOPE_API_KEY（项目内不存在任何含密钥的配置文件）
# 优先级说明：环境变量并不是"覆盖"配置文件，而是本文件占位符的唯一取值来源。
# 反例：若存在 profile-specific 的 application-local.properties 并硬编码同一个 key，
# 它的优先级高于本文件，会把下面的占位符压制掉 —— 环境变量看似配了却完全失效。该文件已移除。
# Windows 持久化：setx DASHSCOPE_API_KEY "sk-xxx"（重启终端/IDE 生效）
# Linux / macOS：export DASHSCOPE_API_KEY=sk-xxx
spring.ai.model.chat=openai
spring.ai.model.embedding=openai
spring.ai.openai.api-key=${DASHSCOPE_API_KEY:}
spring.ai.openai.base-url=https://dashscope.aliyuncs.com/compatible-mode
spring.ai.openai.chat.options.model=qwen3.7-flash
spring.ai.openai.embedding.options.model=qwen3.7-text-embedding

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.client-type=jedis

spring.ai.vectorstore.redis.initialize-schema=true
spring.ai.vectorstore.redis.index-name=ai-agent-index
spring.ai.vectorstore.redis.prefix=ai-agent-doc

logging.level.org.springframework.ai=DEBUG

spring.datasource.url=jdbc:postgresql://localhost:5432/aiagent
spring.datasource.username=admin
spring.datasource.password=${DB_PASSWORD:admin123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===== MCP Client????????? =====
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=60s

# --- Filesystem MCP：给分析官 Agent 读上传资料用 ---
# 根目录收窄到 data/：LLM 只能读 ./data（上传的简历/JD/知识库/test 资料），
# 碰不到 src/ 源码与任何配置文件 —— 杜绝"LLM 经 MCP 工具读到仓库内密钥"这条隐蔽泄露通道。
# ${user.dir} 是 JVM 进程工作目录，跨平台替换原先硬编码的 D:/java/AI-agent-test。
app.mcp.filesystem.allowed-root=${user.dir}/data
spring.ai.mcp.client.stdio.connections.filesystem.command=cmd.exe
spring.ai.mcp.client.stdio.connections.filesystem.args[0]=/c
spring.ai.mcp.client.stdio.connections.filesystem.args[1]=npx
spring.ai.mcp.client.stdio.connections.filesystem.args[2]=-y
spring.ai.mcp.client.stdio.connections.filesystem.args[3]=@modelcontextprotocol/server-filesystem
spring.ai.mcp.client.stdio.connections.filesystem.args[4]=${app.mcp.filesystem.allowed-root}

# --- Fetch MCP：读取候选人分享的 URL 内容，基于文章/文档出题 ---
# 暂时注释：@modelcontextprotocol/server-fetch 的 npm 包已下架（404），需换替代方案，后续再补
#spring.ai.mcp.client.stdio.connections.fetch.command=cmd.exe
#spring.ai.mcp.client.stdio.connections.fetch.args[0]=/c
#spring.ai.mcp.client.stdio.connections.fetch.args[1]=npx
#spring.ai.mcp.client.stdio.connections.fetch.args[2]=-y
#spring.ai.mcp.client.stdio.connections.fetch.args[3]=@modelcontextprotocol/server-fetch

app.knowledge.path=file:./data/knowledges/

# ===== 上传资料（阶段 7：JD/简历上传直通资料流水线，WebFlux 纯文本体）=====
spring.codec.max-in-memory-size=2MB
app.materials.upload-dir=./data/uploads

# ===== 面试入场（阶段 8）=====
# 错误 message 不再经 Boot 默认错误属性透传：400 的中文原因（如"请先完成面试入场"）
# 统一由 GlobalExceptionHandler 的 ApiError.message 携带，此处关 always 防止内部异常细节泄露给客户端。
server.error.include-message=never
